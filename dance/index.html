<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clawd ダンス</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Clawd ダンス</h1>

    <div class="stage dance-sway" id="stage">
      <svg viewBox="-20 -60 180 160" shape-rendering="crispEdges" role="img" aria-label="踊る Clawd">
        <ellipse class="shadow" cx="70" cy="92" rx="48" ry="5"></ellipse>
        <g class="clawd">
          <rect class="arm arm-left" x="4" y="30" width="16" height="12"></rect>
          <rect class="arm arm-right" x="120" y="30" width="16" height="12"></rect>
          <rect class="body" x="20" y="10" width="100" height="50"></rect>
          <g class="eyes">
            <rect x="40" y="22" width="10" height="14"></rect>
            <rect x="90" y="22" width="10" height="14"></rect>
          </g>
          <g class="eyes-happy">
            <rect x="35" y="32" width="4" height="4"></rect>
            <rect x="39" y="28" width="4" height="4"></rect>
            <rect x="43" y="24" width="4" height="4"></rect>
            <rect x="47" y="28" width="4" height="4"></rect>
            <rect x="51" y="32" width="4" height="4"></rect>
            <rect x="85" y="32" width="4" height="4"></rect>
            <rect x="89" y="28" width="4" height="4"></rect>
            <rect x="93" y="24" width="4" height="4"></rect>
            <rect x="97" y="28" width="4" height="4"></rect>
            <rect x="101" y="32" width="4" height="4"></rect>
          </g>
          <g class="cheeks">
            <rect x="28" y="42" width="10" height="6"></rect>
            <rect x="102" y="42" width="10" height="6"></rect>
          </g>
          <rect class="leg leg-a" x="28" y="60" width="8" height="24"></rect>
          <rect class="leg leg-b" x="44" y="60" width="8" height="24"></rect>
          <rect class="leg leg-a" x="88" y="60" width="8" height="24"></rect>
          <rect class="leg leg-b" x="104" y="60" width="8" height="24"></rect>
        </g>
        <g id="hearts"></g>
      </svg>
    </div>

    <div class="affection">
      <div class="affection-row">
        <span class="affection-label">なかよし度</span>
        <div class="gauge" id="gauge" role="progressbar" aria-label="なかよし度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="gauge-fill" id="gauge-fill"></div>
        </div>
        <span class="affection-value"><span id="affection-value">0</span> / 100</span>
      </div>
      <p class="hint">Clawd の上でドラッグして左右になでてみよう</p>
      <p class="level-message" id="level-message" role="status"></p>
    </div>

    <div class="controls" role="group" aria-label="踊りの種類">
      <button type="button" class="dance-btn" data-dance="sway" aria-pressed="true">ゆらゆら</button>
      <button type="button" class="dance-btn" data-dance="jump" aria-pressed="false">ジャンプ</button>
      <button type="button" class="dance-btn" data-dance="wave" aria-pressed="false">手ふり</button>
    </div>

    <button type="button" class="music-btn" id="music" aria-pressed="false">♪ 音楽 ON</button>

    <div class="reset">
      <button type="button" class="reset-btn" id="reset">なかよし度をリセット</button>
      <div class="reset-confirm" id="reset-confirm" hidden>
        <span>本当にリセットしますか？</span>
        <button type="button" id="reset-yes">はい</button>
        <button type="button" id="reset-no">いいえ</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
